name: Prototype verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: prototype-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npm test && npm run check
        working-directory: backend
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libsdl2-dev libcurl4-openssl-dev nlohmann-json3-dev libssl-dev ffmpeg
      - run: cmake --preset linux-asan-ubsan
      - run: cmake --build --preset linux-asan-ubsan --parallel 2
      - run: ctest --preset linux-asan-ubsan
      - run: python3 tools/generate_media.py /tmp/party-test.mp4
      - run: python3 tools/run_loopback.py build/linux-asan-ubsan/party_loopback /tmp/party-test.mp4
      - run: python3 tools/run_loopback.py build/linux-asan-ubsan/party_loopback /tmp/party-test.mp4 --impair
      - run: python3 tools/run_loopback.py build/linux-asan-ubsan/party_loopback /tmp/party-test.mp4 --window
        env:
          PARTY_TEST_HIGH_QUALITY: "1"
      - run: python3 tools/generate_media.py /tmp/party-raw.mp4 --raw
      - run: python3 tools/run_loopback.py build/linux-asan-ubsan/party_loopback /tmp/party-raw.mp4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: backend
      - run: python3 tools/two_process.py build/linux-asan-ubsan/party /tmp/party-test.mp4 --outage --report two-process-linux.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-process-report
          path: |
            two-process-linux.json
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: C:/Users/runneradmin/AppData/Local/vcpkg/archives
          key: vcpkg-windows-x64-${{ hashFiles('vcpkg.json') }}
      - name: Configure pinned vcpkg dependencies
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
      - uses: actions/cache/save@v4
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        with:
          path: C:/Users/runneradmin/AppData/Local/vcpkg/archives
          key: vcpkg-windows-x64-${{ hashFiles('vcpkg.json') }}
      - run: cmake --build build --config Release --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-prototype
          path: |
            build/Release/party.exe
            build/Release/*.dll
            build/vcpkg_installed/x64-windows/bin/*.dll
      - name: Runtime DLL and test-tool paths
        shell: pwsh
        run: |
          "$PWD/build/vcpkg_installed/x64-windows/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$PWD/build/vcpkg_installed/x64-windows/tools/ffmpeg" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:/Program Files/Git/usr/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Real local streaming with software encoding
        shell: pwsh
        run: |
          $env:PATH = "$PWD/build/vcpkg_installed/x64-windows/bin;$PWD/build/vcpkg_installed/x64-windows/tools/ffmpeg;$env:PATH"
          python tools/generate_media.py "$env:TEMP/party-test.mp4"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run_loopback.py build/Release/party_loopback.exe "$env:TEMP/party-test.mp4"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run_loopback.py build/Release/party_loopback.exe "$env:TEMP/party-test.mp4" --impair

      - run: npm ci
        working-directory: backend
      - name: Separate host and viewer with TLS signaling and response loss
        shell: pwsh
        run: python tools/two_process.py build/Release/party.exe "$env:TEMP/party-test.mp4" --outage --report two-process-windows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-process-report
          path: two-process-windows.json
